<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Veterinaria Mundo mascota</h1>
    <p>Cuidamos a tu mejor amigo</p>
</header>

<main>

    <section id="formulario">
        <h2>Agendar Cita</h2>
        <form>
            <label>Nombre Mascota</label>
            <input type="text" required>

            <label>Nombre Dueño</label>
            <input type="text" required>

            <label>Fecha</label>
            <input type="date" required>

            <label>Motivo</label>
            <textarea></textarea>

            <button type="submit">Registrar Cita</button>
        </form>
    </section>

    <section id="citas">
        <h2>Citas Registradas</h2>
        <ul>
            <li class="cita pendiente">Firulais - Vacunación</li>
            <li class="cita atendida">Michi - Control</li>
        </ul>
    </section>

    <section id="servicios">
        <h2>Servicios</h2>
        <article>Consulta general</article>
        <article>Vacunación</article>
        <article>Cirugía</article>
    </section>

</main>

<footer>
    <p>Veterinaria Mundo Mascota © 2026</p>
</footer>

</body>
</html>
